<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#132039"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)" rx="12"/>

  <!-- Header -->
  <rect x="24" y="24" width="752" height="50" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="44" y="56" fill="#c9a227" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Executive KPI Dashboard</text>
  <rect x="680" y="36" width="80" height="26" fill="rgba(52,211,153,0.2)" rx="13"/>
  <text x="720" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">● Live</text>

  <!-- KPI Cards Row 1 -->
  <rect x="24" y="90" width="180" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="44" y="118" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">MONTHLY REVENUE</text>
  <text x="44" y="152" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">$428K</text>
  <text x="44" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">↑ 12.4% vs LM</text>

  <rect x="216" y="90" width="180" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="236" y="118" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">GROSS MARGIN</text>
  <text x="236" y="152" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">68.2%</text>
  <text x="236" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">↑ 3.1pp vs LM</text>

  <rect x="408" y="90" width="180" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="428" y="118" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">EBITDA</text>
  <text x="428" y="152" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">$94K</text>
  <text x="428" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">22% margin</text>

  <rect x="600" y="90" width="176" height="100" fill="rgba(201,162,39,0.15)" rx="8"/>
  <text x="620" y="118" fill="#c9a227" font-family="system-ui, sans-serif" font-size="11">CASH POSITION</text>
  <text x="620" y="152" fill="#c9a227" font-family="system-ui, sans-serif" font-size="28" font-weight="700">$1.07M</text>
  <text x="620" y="175" fill="rgba(201,162,39,0.7)" font-family="system-ui, sans-serif" font-size="12">14.2 mo runway</text>

  <!-- KPI Cards Row 2 -->
  <rect x="24" y="206" width="180" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="44" y="234" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">CUSTOMER COUNT</text>
  <text x="44" y="268" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">847</text>
  <text x="44" y="291" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">↑ 23 new this month</text>

  <rect x="216" y="206" width="180" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="236" y="234" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">CAC</text>
  <text x="236" y="268" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">$1,240</text>
  <text x="236" y="291" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">↓ 8% vs target</text>

  <rect x="408" y="206" width="180" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="428" y="234" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">LTV:CAC RATIO</text>
  <text x="428" y="268" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">4.2x</text>
  <text x="428" y="291" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Above 3x target</text>

  <rect x="600" y="206" width="176" height="100" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="620" y="234" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">CHURN RATE</text>
  <text x="620" y="268" fill="#fff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">2.1%</text>
  <text x="620" y="291" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">↓ 0.4pp vs LM</text>

  <!-- Revenue Trend Chart -->
  <rect x="24" y="322" width="370" height="154" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="44" y="350" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">REVENUE TREND (6 MONTHS)</text>

  <!-- Mini bar chart -->
  <rect x="60" y="420" width="40" height="35" fill="rgba(201,162,39,0.4)" rx="3"/>
  <rect x="110" y="405" width="40" height="50" fill="rgba(201,162,39,0.5)" rx="3"/>
  <rect x="160" y="395" width="40" height="60" fill="rgba(201,162,39,0.6)" rx="3"/>
  <rect x="210" y="385" width="40" height="70" fill="rgba(201,162,39,0.7)" rx="3"/>
  <rect x="260" y="375" width="40" height="80" fill="rgba(201,162,39,0.8)" rx="3"/>
  <rect x="310" y="360" width="40" height="95" fill="#c9a227" rx="3"/>

  <text x="80" y="465" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Mar</text>
  <text x="130" y="465" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Apr</text>
  <text x="180" y="465" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">May</text>
  <text x="230" y="465" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Jun</text>
  <text x="280" y="465" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Jul</text>
  <text x="330" y="465" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Aug</text>

  <!-- Expense Breakdown -->
  <rect x="406" y="322" width="370" height="154" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="426" y="350" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">EXPENSE BREAKDOWN</text>

  <!-- Donut chart representation -->
  <circle cx="500" cy="415" r="50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="20"/>
  <circle cx="500" cy="415" r="50" fill="none" stroke="#c9a227" stroke-width="20" stroke-dasharray="110 204" stroke-dashoffset="0"/>
  <circle cx="500" cy="415" r="50" fill="none" stroke="#34d399" stroke-width="20" stroke-dasharray="65 249" stroke-dashoffset="-110"/>
  <circle cx="500" cy="415" r="50" fill="none" stroke="#60a5fa" stroke-width="20" stroke-dasharray="45 269" stroke-dashoffset="-175"/>
  <text x="500" y="410" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">$334K</text>
  <text x="500" y="428" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Total</text>

  <!-- Legend -->
  <rect x="580" y="375" width="10" height="10" fill="#c9a227" rx="2"/>
  <text x="596" y="384" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="11">Payroll 35%</text>

  <rect x="580" y="400" width="10" height="10" fill="#34d399" rx="2"/>
  <text x="596" y="409" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="11">Marketing 21%</text>

  <rect x="580" y="425" width="10" height="10" fill="#60a5fa" rx="2"/>
  <text x="596" y="434" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="11">Operations 14%</text>

  <rect x="580" y="450" width="10" height="10" fill="rgba(255,255,255,0.2)" rx="2"/>
  <text x="596" y="459" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="11">Other 30%</text>
</svg>
