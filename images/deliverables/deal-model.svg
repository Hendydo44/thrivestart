<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#132039"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad4)" rx="12"/>

  <!-- Header -->
  <rect x="24" y="24" width="752" height="50" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="44" y="56" fill="#c9a227" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Deal Structuring Model</text>
  <text x="756" y="56" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Scenario: Base Case</text>

  <!-- Deal Summary Section -->
  <rect x="24" y="90" width="365" height="180" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="44" y="118" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PURCHASE PRICE ALLOCATION</text>

  <!-- Table headers -->
  <rect x="40" y="130" width="333" height="28" fill="rgba(201,162,39,0.15)" rx="4"/>
  <text x="56" y="149" fill="#c9a227" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Component</text>
  <text x="280" y="149" fill="#c9a227" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">Amount</text>
  <text x="357" y="149" fill="#c9a227" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">%</text>

  <!-- Table rows -->
  <text x="56" y="178" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="12">Enterprise Value</text>
  <text x="280" y="178" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">$8,500,000</text>
  <text x="357" y="178" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">100%</text>
  <line x1="40" y1="188" x2="373" y2="188" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="56" y="207" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="12">Senior Debt</text>
  <text x="280" y="207" fill="#fff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$4,250,000</text>
  <text x="357" y="207" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">50%</text>
  <line x1="40" y1="217" x2="373" y2="217" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="56" y="236" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="12">Seller Note</text>
  <text x="280" y="236" fill="#fff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$1,275,000</text>
  <text x="357" y="236" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">15%</text>
  <line x1="40" y1="246" x2="373" y2="246" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="56" y="265" fill="#c9a227" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Equity at Close</text>
  <text x="280" y="265" fill="#c9a227" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">$2,975,000</text>
  <text x="357" y="265" fill="#c9a227" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">35%</text>

  <!-- Earnout Section -->
  <rect x="405" y="90" width="371" height="180" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="425" y="118" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">EARNOUT STRUCTURE</text>

  <rect x="421" y="130" width="339" height="28" fill="rgba(52,211,153,0.15)" rx="4"/>
  <text x="437" y="149" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Milestone</text>
  <text x="600" y="149" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">Target</text>
  <text x="744" y="149" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">Payout</text>

  <text x="437" y="178" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="12">Year 1 Revenue</text>
  <text x="600" y="178" fill="#fff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$3.2M</text>
  <text x="744" y="178" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$250,000</text>
  <line x1="421" y1="188" x2="760" y2="188" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="437" y="207" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="12">Year 2 EBITDA</text>
  <text x="600" y="207" fill="#fff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$680K</text>
  <text x="744" y="207" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$350,000</text>
  <line x1="421" y1="217" x2="760" y2="217" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="437" y="236" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="12">Customer Retention</text>
  <text x="600" y="236" fill="#fff" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">&gt;90%</text>
  <text x="744" y="236" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">$150,000</text>
  <line x1="421" y1="246" x2="760" y2="246" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="437" y="265" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Max Earnout</text>
  <text x="744" y="265" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">$750,000</text>

  <!-- Working Capital Section -->
  <rect x="24" y="286" width="365" height="120" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="44" y="314" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WORKING CAPITAL</text>

  <text x="44" y="345" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12">Target NWC Peg</text>
  <text x="373" y="345" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">$420,000</text>

  <text x="44" y="370" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12">Collar (+/-)</text>
  <text x="373" y="370" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">$25,000</text>

  <text x="44" y="395" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12">True-Up Period</text>
  <text x="373" y="395" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">90 days post-close</text>

  <!-- Scenario Analysis -->
  <rect x="405" y="286" width="371" height="120" fill="rgba(255,255,255,0.05)" rx="8"/>
  <text x="425" y="314" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SCENARIO ANALYSIS - BUYER IRR</text>

  <rect x="421" y="330" width="105" height="60" fill="rgba(248,113,113,0.1)" rx="6"/>
  <text x="473" y="355" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">DOWNSIDE</text>
  <text x="473" y="378" fill="#f87171" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">12.4%</text>

  <rect x="536" y="330" width="105" height="60" fill="rgba(201,162,39,0.15)" rx="6"/>
  <text x="588" y="355" fill="#c9a227" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">BASE CASE</text>
  <text x="588" y="378" fill="#c9a227" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">24.8%</text>

  <rect x="651" y="330" width="109" height="60" fill="rgba(52,211,153,0.1)" rx="6"/>
  <text x="705" y="355" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">UPSIDE</text>
  <text x="705" y="378" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">38.2%</text>

  <!-- Bottom Summary -->
  <rect x="24" y="420" width="752" height="56" fill="rgba(201,162,39,0.1)" rx="8"/>
  <text x="44" y="445" fill="#c9a227" font-family="system-ui, sans-serif" font-size="11">TOTAL CONSIDERATION</text>
  <text x="44" y="465" fill="#fff" font-family="system-ui, sans-serif" font-size="14">$8.5M at close + up to $750K earnout = $9.25M max</text>

  <text x="500" y="445" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11">EV/EBITDA MULTIPLE</text>
  <text x="500" y="465" fill="#c9a227" font-family="system-ui, sans-serif" font-size="18" font-weight="700">5.2x</text>

  <text x="660" y="445" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11">EQUITY CHECK</text>
  <text x="660" y="465" fill="#c9a227" font-family="system-ui, sans-serif" font-size="18" font-weight="700">$2.975M</text>
</svg>
