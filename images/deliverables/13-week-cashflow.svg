  <text x="44" y="62" fill="#c9a227" font-family="system-ui, sans-serif" font-size="18" font-weight="600">13-Week Rolling Cash Flow Forecast</text>
  <text x="730" y="62" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Updated: Live</text>

  <!-- Summary Cards -->
  <rect x="24" y="100" width="175" height="80" fill="rgba(255,255,255,0.08)" rx="8"/>
