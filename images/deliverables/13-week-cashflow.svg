  <text x="44" y="158" fill="#fff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">$847,200</text>

  <rect x="215" y="100" width="175" height="80" fill="rgba(255,255,255,0.08)" rx="8"/>
  <text x="235" y="128" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">PROJECTED INFLOWS</text>
  <text x="235" y="158" fill="#34d399" font-family="system-ui, sans-serif" font-size="24" font-weight="700">+$1.2M</text>

  <rect x="406" y="100" width="175" height="80" fill="rgba(255,255,255,0.08)" rx="8"/>
