  <text x="80" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W1</text>
  <text x="184" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W3</text>
  <text x="288" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W5</text>
  <text x="392" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W7</text>
  <text x="496" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W9</text>
  <text x="600" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W11</text>
  <text x="704" y="405" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">W13</text>

