  <text x="300" y="445" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="11">AVG WEEKLY BURN</text>
  <text x="300" y="465" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">$75,400</text>

  <rect x="536" y="420" width="240" height="56" fill="rgba(52,211,153,0.1)" rx="8"/>
  <text x="556" y="445" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">RUNWAY</text>
