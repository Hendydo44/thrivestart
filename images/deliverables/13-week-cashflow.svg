  <path d="M80,300 L132,285 L184,275 L236,290 L288,260 L340,245 L392,255 L444,235 L496,220 L548,210 L600,225 L652,205 L704,195 L756,180 L756,380 L80,380 Z"
        fill="url(#goldGrad)" fill-opacity="0.15"/>

  <!-- Data points -->
  <circle cx="80" cy="300" r="4" fill="#c9a227"/>
  <circle cx="184" cy="275" r="4" fill="#c9a227"/>
  <circle cx="288" cy="260" r="4" fill="#c9a227"/>
  <circle cx="392" cy="255" r="4" fill="#c9a227"/>
  <circle cx="496" cy="220" r="4" fill="#c9a227"/>
  <circle cx="600" cy="225" r="4" fill="#c9a227"/>
  <circle cx="704" cy="195" r="4" fill="#c9a227"/>
  <circle cx="756" cy="180" r="6" fill="#c9a227" stroke="#fff" stroke-width="2"/>

