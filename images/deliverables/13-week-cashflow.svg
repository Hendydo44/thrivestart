  <rect x="597" y="100" width="179" height="80" fill="rgba(201,162,39,0.15)" rx="8"/>
  <text x="617" y="128" fill="#c9a227" font-family="system-ui, sans-serif" font-size="11">ENDING CASH (WK 13)</text>
  <text x="617" y="158" fill="#c9a227" font-family="system-ui, sans-serif" font-size="24" font-weight="700">$1.07M</text>

  <!-- Chart Area -->
  <rect x="24" y="196" width="752" height="200" fill="rgba(255,255,255,0.03)" rx="8"/>

