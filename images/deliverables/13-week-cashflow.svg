  <text x="40" y="220" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">$1.2M</text>
  <text x="40" y="270" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">$900K</text>
  <text x="40" y="320" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">$600K</text>
  <text x="40" y="370" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">$300K</text>

