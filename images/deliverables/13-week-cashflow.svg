  <line x1="80" y1="266" x2="760" y2="266" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="80" y1="316" x2="760" y2="316" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="80" y1="366" x2="760" y2="366" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Cash flow area chart -->
  <path d="M80,300 L132,285 L184,275 L236,290 L288,260 L340,245 L392,255 L444,235 L496,220 L548,210 L600,225 L652,205 L704,195 L756,180"
